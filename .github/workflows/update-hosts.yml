name: Update Hosts

on:
  workflow_dispatch:
  schedule:
    # Every 2 hours
    - cron: "0 */2 * * *"
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "templates/**"
      - "requirements*.txt"
      - ".github/workflows/update-hosts.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-actions.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-actions.txt

      - name: Generate hosts
        run: |
          python -m src.main --output . --template templates/README.template.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hosts hosts.json README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update hosts $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
